name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  linux:
    runs-on: ubuntu-22.04
    name: OpenMM ${{ matrix.openmm-version }}
    strategy:
      fail-fast: false
      matrix:
        # Every minor version of the supported range (see CONTRIBUTING.md).
        openmm-version: ["8.3", "8.4", "8.5", "8.6"]

    steps:
      - name: "Check out"
        uses: actions/checkout@v4

      - name: "Select the OpenMM version"
        run: sed -i "s/@OPENMM_VERSION@/${{ matrix.openmm-version }}.*/" devtools/conda-envs/build-ubuntu.yml

      - uses: conda-incubator/setup-miniconda@v3
        name: "Install dependencies"
        with:
          activate-environment: build
          environment-file: devtools/conda-envs/build-ubuntu.yml
          miniforge-version: latest
          python-version: "3.11"
        env:
          # The CI hosts have no NVIDIA driver: the CUDA platform is built but not tested.
          CONDA_OVERRIDE_CUDA: "12.9"

      - name: "Match SWIG to the OpenMM Python module"
        shell: bash -l {0}
        run: |
          # SWIG modules exchange types only if they were generated by the same SWIG version.
          SWIG_VERSION=$(python -c "import openmm, os, re; t = open(os.path.join(os.path.dirname(openmm.__file__), 'openmm.py')).read(4096); print(re.search(r'Version ([0-9.]+)', t).group(1))")
          echo "OpenMM Python module generated by SWIG ${SWIG_VERSION}"
          conda install -y -c conda-forge "swig=${SWIG_VERSION}"
        env:
          CONDA_OVERRIDE_CUDA: "12.9"

      - name: "List conda packages"
        shell: bash -l {0}
        run: conda list

      - name: "Configure"
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENMM_DIR=${CONDA_PREFIX} \
            -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX}

      - name: "Build"
        shell: bash -l {0}
        run: |
          cd build
          make -j2 install
          make -j2 PythonInstall

      - name: "List plugins"
        shell: bash -l {0}
        run: |
          python -c "import openmm as mm; print('---Loaded---', *mm.pluginLoadedLibNames, '---Failed---', *mm.Platform.getPluginLoadFailures(), sep='\n')"

      - name: "Run C++ tests"
        shell: bash -l {0}
        run: |
          cd build
          ctest --output-on-failure --exclude-regex "TestCuda|TestHip"

      - name: "Run Python tests"
        shell: bash -l {0}
        run: |
          cd python/tests
          python -m pytest -v

  mpi:
    # The domain decomposition (OPENMM_LBM_MPI) on CPUs: the Reference platform and OpenCL (PoCL), with up to eight
    # MPI ranks.  The decomposition on GPUs cannot run here and is tested by hand before every release.
    runs-on: ubuntu-22.04
    name: MPI (OpenMM 8.6)
    timeout-minutes: 60
    steps:
      - name: "Check out"
        uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        name: "Install dependencies"
        with:
          activate-environment: build
          environment-file: devtools/conda-envs/build-mpi-ubuntu.yml
          miniforge-version: latest
          python-version: "3.11"
        env:
          CONDA_OVERRIDE_CUDA: "12.9"

      - name: "Match SWIG to the OpenMM Python module"
        shell: bash -l {0}
        run: |
          SWIG_VERSION=$(python -c "import openmm, os, re; t = open(os.path.join(os.path.dirname(openmm.__file__), 'openmm.py')).read(4096); print(re.search(r'Version ([0-9.]+)', t).group(1))")
          echo "OpenMM Python module generated by SWIG ${SWIG_VERSION}"
          conda install -y -c conda-forge "swig=${SWIG_VERSION}"
        env:
          CONDA_OVERRIDE_CUDA: "12.9"

      - name: "List conda packages"
        shell: bash -l {0}
        run: conda list

      - name: "Configure"
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENMM_DIR=${CONDA_PREFIX} \
            -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX} \
            -DOPENMM_LBM_MPI=ON

      - name: "Build"
        shell: bash -l {0}
        run: |
          cd build
          make -j2 install
          make -j2 PythonInstall

      - name: "Run C++ tests"
        shell: bash -l {0}
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          cd build
          ctest --output-on-failure --exclude-regex "TestCuda|TestHip"

      - name: "Run Python tests"
        shell: bash -l {0}
        run: |
          cd python/tests
          python -m pytest -v

      - name: "Run the MPI tests"
        shell: bash -l {0}
        env:
          OMPI_MCA_rmaps_base_oversubscribe: "1"
        run: |
          set -eo pipefail
          mkdir -p mpi_work
          cd mpi_work
          for d in "2 1 1" "1 2 2" "2 2 2"; do
            set -- $d
            mpirun -n $(($1*$2*$3)) python ../python/tests/mpi_decomposition.py $d 2>&1 | tee out.txt
            if grep -q FAILED out.txt; then exit 1; fi
          done
          mpirun -n 4 python ../python/tests/mpi_decomposition.py 2 2 1 OpenCL 2>&1 | tee out.txt
          if grep -q FAILED out.txt; then exit 1; fi
          # An exception on one rank must stop both ranks (a non-zero exit code), not leave them waiting (124).
          rc=0
          timeout 300 mpirun -n 2 python ../python/tests/mpi_abort.py || rc=$?
          echo "mpi_abort.py exit code ${rc}"
          test ${rc} -ne 0 && test ${rc} -ne 124

      - name: "Reminder: the decomposition on GPUs"
        run: |
          echo "::warning title=Domain decomposition on GPUs::This job runs the domain decomposition on CPUs only. Before every release run python/tests/mpi_decomposition.py on GPUs (CUDA in the three precisions, OpenCL), with the blocks divided along x, y and z, on one node with several GPUs and on two nodes (CONTRIBUTING.md, Tests and acceptance)."

  hip:
    runs-on: ubuntu-22.04
    name: HIP build (OpenMM 8.6)
    # The CI hosts have no AMD GPU: the HIP platform is compiled and linked, not tested.

    steps:
      - name: "Check out"
        uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        name: "Install dependencies"
        with:
          activate-environment: build
          environment-file: devtools/conda-envs/build-hip-ubuntu.yml
          miniforge-version: latest
          python-version: "3.11"
        env:
          CONDA_OVERRIDE_CUDA: "12.9"

      - name: "Configure"
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENMM_DIR=${CONDA_PREFIX} \
            -DCMAKE_INSTALL_PREFIX=${CONDA_PREFIX} \
            -DLBM_BUILD_HIP_LIB=ON \
            -DLBM_BUILD_PYTHON_WRAPPERS=OFF

      - name: "Build"
        shell: bash -l {0}
        run: |
          cd build
          make -j2
          test -f libOpenMMLBMHIP.so
